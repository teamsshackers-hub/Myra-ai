name: Build MYRA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -x
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          SDK_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMGR=""
          for d in "$SDK_HOME/cmdline-tools/latest/bin" "$SDK_HOME/cmdline-tools/bin" "$SDK_HOME/tools/bin"; do
            if [ -x "$d/sdkmanager" ]; then SDKMGR="$d/sdkmanager"; break; fi
          done
          if [ -z "$SDKMGR" ]; then
            SDKMGR=$(find "${SDK_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "FATAL: sdkmanager not found. Searching wider:"
            find / -maxdepth 7 -name sdkmanager -type f 2>/dev/null | head -5
            exit 1
          fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee /tmp/build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" "$APK" --title "MYRA APK $TAG" --notes "Debug APK built automatically via GitHub Actions."

      - name: Report diagnostics on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "=== env ==="
            echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
            echo "=== GRADLE BUILD LOG (tail) ==="
            tail -c 12000 /tmp/build.log 2>&1 || echo "no build log"
          } > /tmp/diag.txt 2>&1
          gh issue create --title "Build diagnostics run ${{ github.run_number }}" --body-file /tmp/diag.txt || echo "issue create failed"
